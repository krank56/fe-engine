[package]
name = "fe-engine"
version = "0.1.0"
edition = "2021"
authors = ["krank56 <https://github.com/krank56>"]
license = "MIT"
repository = "https://github.com/krank56/fe-engine"
documentation = "https://docs.rs/fe-engine"
homepage = "https://github.com/krank56/fe-engine"
readme = "README.md"
keywords = ["finite-element", "structural-engineering", "fea", "gpu", "engineering"]
categories = ["science", "simulation"]
description = "GPU-accelerated finite element analysis engine for structural engineering"

[dependencies]
nalgebra = "0.33"
nalgebra-sparse = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
bitflags = { version = "2.4", features = ["serde"] }
md5 = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.3", optional = true }
objc2-metal = { version = "0.3.2", optional = true }
objc2-foundation = { version = "0.3.2", optional = true }

[dev-dependencies]
approx = "0.5"
tempfile = "3.8"

[features]
default = []
gpu = ["objc2", "objc2-metal", "objc2-foundation"]

[[test]]
name = "simple_beam"
path = "tests/benchmarks/simple_beam.rs"

[[test]]
name = "portal_frame"
path = "tests/benchmarks/portal_frame.rs"

[[test]]
name = "test_solver"
path = "tests/contract/test_solver.rs"

[[test]]
name = "test_beam_analysis"
path = "tests/integration/test_beam_analysis.rs"

[[test]]
name = "test_frame_analysis"
path = "tests/integration/test_frame_analysis.rs"

[[test]]
name = "gpu_repro"
path = "tests/benchmarks/gpu_repro.rs"

[[test]]
name = "solver_perf"
path = "tests/benchmarks/solver_perf.rs"

[[test]]
name = "test_audit_trail"
path = "tests/contract/test_audit_trail.rs"

[[test]]
name = "test_report_export"
path = "tests/integration/test_report_export.rs"

[[test]]
name = "cpu_vs_gpu_bench"
path = "tests/benchmarks/cpu_vs_gpu_bench.rs"

[[test]]
name = "matrix_free_bench"
path = "tests/benchmarks/matrix_free_bench.rs"
